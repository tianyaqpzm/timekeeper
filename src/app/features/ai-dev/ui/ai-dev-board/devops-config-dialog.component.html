<div class="dialog-container p-6 w-[480px] max-w-full flex flex-col gap-5 dark:bg-[#1e1f20] dark:text-[#e3e3e3] rounded-3xl">
  <!-- Header -->
  <div class="flex flex-col gap-1">
    <div class="flex items-center gap-3">
      <div class="p-2 bg-blue-50 dark:bg-blue-950/40 rounded-xl text-blue-600 dark:text-blue-400 flex items-center justify-center shadow-sm">
        <mat-icon class="!text-[22px] !w-[22px] !h-[22px] !inline-flex !items-center !justify-center">settings</mat-icon>
      </div>
      <h2 class="text-lg font-bold m-0 bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 dark:from-blue-400 dark:via-indigo-400 dark:to-purple-400 bg-clip-text text-transparent">
        {{ 'AI_DEV.DEVOPS_CONFIG' | translate }}
      </h2>
    </div>
    <p class="text-xs text-slate-500 dark:text-slate-400 mt-2">
      配置本地 ms-ai-devops 服务的物理工程路径和后台 API 接口端口。
    </p>
  </div>

  <!-- Form Content -->
  <div class="flex flex-col gap-4">
    <!-- API URL Input -->
    <div class="flex flex-col gap-1.5">
      <label class="text-xs font-semibold text-slate-700 dark:text-slate-300 flex items-center gap-1">
        <mat-icon class="!text-[14px] !w-3.5 !h-3.5 !inline-flex !items-center !justify-center text-slate-400">dns</mat-icon>
        {{ 'AI_DEV.DEVOPS_URL' | translate }}
      </label>
      <div class="input-card flex items-center bg-slate-50 dark:bg-black/20 border border-slate-200 dark:border-[#444746] rounded-xl px-3.5 py-2.5 transition-all focus-within:border-blue-500 focus-within:ring-2 focus-within:ring-blue-500/10">
        <input
          type="text"
          [(ngModel)]="devopsUrl"
          [placeholder]="'AI_DEV.DEVOPS_URL_PLACEHOLDER' | translate"
          class="bg-transparent border-none outline-none w-full text-sm text-slate-800 dark:text-white placeholder-slate-400 dark:placeholder-slate-500"
        />
      </div>
    </div>

    <!-- Workspace Path Input -->
    <div class="flex flex-col gap-1.5">
      <label class="text-xs font-semibold text-slate-700 dark:text-slate-300 flex items-center gap-1">
        <mat-icon class="!text-[14px] !w-3.5 !h-3.5 !inline-flex !items-center !justify-center text-slate-400">folder</mat-icon>
        {{ 'AI_DEV.DEVOPS_PATH' | translate }}
      </label>
      <div class="input-card flex items-center bg-slate-50 dark:bg-black/20 border border-slate-200 dark:border-[#444746] rounded-xl px-3.5 py-2.5 transition-all focus-within:border-blue-500 focus-within:ring-2 focus-within:ring-blue-500/10">
        <input
          type="text"
          [(ngModel)]="devopsPath"
          [placeholder]="'AI_DEV.DEVOPS_PATH_PLACEHOLDER' | translate"
          class="bg-transparent border-none outline-none w-full text-sm text-slate-800 dark:text-white placeholder-slate-400 dark:placeholder-slate-500"
        />
      </div>
    </div>
  </div>

  <!-- Status Banner Area -->
  <div class="min-h-[46px] flex flex-col justify-center">
    <div *ngIf="isTesting" class="p-3 bg-blue-50 dark:bg-blue-950/20 border border-blue-100 dark:border-blue-800/30 rounded-xl flex items-center gap-2.5 animate-pulse">
      <mat-icon class="animate-spin text-blue-500 !text-[18px] !w-5 !h-5 !inline-flex !items-center !justify-center">sync</mat-icon>
      <span class="text-xs font-medium text-blue-700 dark:text-blue-400">
        {{ 'AI_DEV.DEVOPS_CONNECTING' | translate }}...
      </span>
    </div>

    <div *ngIf="testStatus === 'SUCCESS'" class="p-3 bg-emerald-50 dark:bg-emerald-950/25 border border-emerald-200 dark:border-emerald-800/30 rounded-xl flex items-start gap-2.5 animate-fade-in-up">
      <mat-icon class="text-emerald-500 !text-[18px] !w-5 !h-5 mt-0.5 !inline-flex !items-center !justify-center">check_circle</mat-icon>
      <div class="flex flex-col">
        <span class="text-xs font-semibold text-emerald-700 dark:text-emerald-400">
          {{ 'AI_DEV.DEVOPS_CONNECTED' | translate }}
        </span>
        <span class="text-[10px] text-emerald-500 dark:text-emerald-400/80 mt-0.5">
          服务在线且连接正常！
        </span>
      </div>
    </div>

    <div *ngIf="testStatus === 'FAILED'" class="p-3 bg-rose-50 dark:bg-rose-950/25 border border-rose-200 dark:border-rose-800/30 rounded-xl flex items-start gap-2.5 animate-fade-in-up">
      <mat-icon class="text-rose-500 !text-[18px] !w-5 !h-5 mt-0.5 !inline-flex !items-center !justify-center">error</mat-icon>
      <div class="flex flex-col flex-1">
        <span class="text-xs font-semibold text-rose-700 dark:text-rose-400">
          连接失败
        </span>
        <span class="text-[10px] text-rose-500 dark:text-rose-400/80 mt-0.5">
          {{ 'AI_DEV.DEVOPS_CHECK_FAIL' | translate }}，请确认服务已启动且端口输入正确。
        </span>
      </div>
    </div>
  </div>

  <!-- Action Row -->
  <div class="flex justify-between items-center mt-2 pt-4 border-t border-slate-100 dark:border-[#2e3032]">
    <!-- Left side: Test Connection Button -->
    <button
      mat-stroked-button
      class="!rounded-xl !px-4 !h-10 !border-slate-200 dark:!border-[#444746] !text-slate-600 dark:!text-slate-300 hover:!bg-slate-50 dark:hover:!bg-white/5 transition-all"
      [disabled]="isTesting || !devopsUrl.trim()"
      (click)="onTestConnection()"
    >
      <mat-icon class="!text-[16px] !w-4 !h-4 !mr-1.5 !inline-flex !items-center !justify-center">leak_add</mat-icon>
      {{ 'AI_DEV.DEVOPS_TEST_BTN' | translate }}
    </button>

    <!-- Right side: Cancel & Save Buttons -->
    <div class="flex gap-3">
      <button 
        mat-button 
        class="!rounded-xl !px-4 !h-10 !text-slate-500 dark:!text-slate-400 hover:!bg-slate-50 dark:hover:!bg-white/5 transition-all" 
        (click)="onCancel()"
      >
        {{ 'COMMON.CANCEL' | translate }}
      </button>
      
      <button
        mat-flat-button
        class="!rounded-xl !px-5 !h-10 !bg-gradient-to-r !from-blue-600 !to-indigo-600 hover:!from-blue-500 hover:!to-indigo-500 !text-white !font-semibold !shadow-md !shadow-blue-600/10 hover:!shadow-lg hover:!shadow-blue-500/20 active:scale-[0.98] transition-all"
        [disabled]="!devopsUrl.trim() || !devopsPath.trim() || isTesting"
        (click)="onSubmit()"
      >
        <mat-icon class="!text-[16px] !w-4 !h-4 !mr-1.5 !inline-flex !items-center !justify-center">save</mat-icon>
        {{ 'COMMON.SAVE' | translate }}
      </button>
    </div>
  </div>
</div>
